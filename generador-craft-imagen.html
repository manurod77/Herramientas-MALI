<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRAFT para ComfyUI · Generador de Prompts</title>
<style>
:root{--bg:#0E1E1A;--panel:#16302A;--panel2:#1D3B33;--deep:#0B1714;--line:#2A4A41;--teal:#8ECFC9;--gold:#C8A951;--txt:#E9F1ED;--mut:#9FB8AE;--neg:#D18B6A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1020px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.eyebrow{color:var(--gold);font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;margin-bottom:3px}
h1{font-size:24px;font-weight:800;margin:0;line-height:1.15}
.sub{color:var(--mut);font-size:12px;margin:3px 0 0}
.tabs{display:flex;gap:4px}
button{font-family:inherit;cursor:pointer;transition:all .13s}
.tab{padding:5px 12px;border-radius:4px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--mut)}
.tab.on{border-color:var(--teal);background:var(--panel);color:var(--teal)}
.lbl{color:var(--gold);font-size:9.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;display:block}
.wf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px}
.wf{padding:8px 9px;border-radius:5px;text-align:left;border:1px solid var(--line);background:var(--deep);color:var(--txt)}
.wf.on{border-color:var(--teal);background:var(--panel)}
.wf.on .wf-t{color:var(--teal)}
.wf-t{font-size:12px;font-weight:700;line-height:1.2}
.wf-s{color:var(--mut);font-size:9.5px;margin-top:2px}
.hint{background:var(--panel2);border-left:3px solid var(--gold);padding:7px 11px;border-radius:3px;font-size:11.5px;color:var(--mut);margin-bottom:14px}
.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.grp{display:flex;gap:4px;align-items:center}
.grp-l{color:var(--mut);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-right:2px}
.opt{padding:5px 12px;border-radius:4px;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--mut)}
.opt.on{border-color:var(--teal);background:var(--panel);color:var(--teal)}
.opt.on.gold{border-color:var(--gold);color:var(--gold)}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:var(--deep);border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--mut);font-size:10px}
.pill b{color:var(--txt)}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.f-l{color:var(--mut);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;display:block;margin-bottom:3px}
input[type=text],select{width:100%;padding:7px 9px;border-radius:4px;border:1px solid var(--line);background:var(--deep);color:var(--txt);font-size:12.5px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--teal)}
.dn-box{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:9px 12px;margin-bottom:14px}
.dn-box.bad{border-color:var(--neg)}
.dn-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.dn-lbl{color:var(--gold);font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.dn-val{font-size:17px;font-weight:800}
.dn-box.bad .dn-val,.dn-box.bad .dn-note{color:var(--neg)}
.dn-note{font-size:10px;color:var(--mut);margin-top:3px}
input[type=range]{width:100%;accent-color:var(--teal)}
.dn-box.bad input[type=range]{accent-color:var(--neg)}
.go{width:100%;padding:11px;border-radius:5px;border:none;background:var(--teal);color:var(--bg);font-size:13px;font-weight:700;margin-bottom:18px}
.out{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.out-h{background:var(--panel);padding:8px 12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.out-meta{display:flex;gap:8px;align-items:baseline}
.out-body{padding:11px 13px;background:var(--deep);font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.out-body.json{font-size:10.5px;max-height:420px;overflow-y:auto}
.out-neg{padding:9px 13px;background:var(--deep);font-family:ui-monospace,monospace;font-size:11px;line-height:1.5;color:var(--neg);white-space:pre-wrap}
.out-foot{background:var(--panel2);padding:6px 13px;border-top:1px solid var(--line);font-size:11px;color:var(--gold)}
.btn-s{padding:4px 11px;border-radius:3px;font-size:11px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--teal);white-space:nowrap}
.btn-s.mut{color:var(--mut)}
.btn-s.ok{background:var(--teal);color:var(--bg);border-color:var(--teal)}
.btn-xs{padding:2px 8px;font-size:10px;border-radius:3px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--teal)}
.btn-xs.ok{background:var(--teal);color:var(--bg)}
.lib-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.lib-bar input[type=text]{flex:1 1 160px}
.lib-bar select{width:auto;font-size:11.5px;padding:6px 8px}
.card{border:1px solid var(--line);border-radius:5px;overflow:hidden;margin-bottom:7px}
.card-h{background:var(--panel);padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card-meta{display:flex;gap:6px;align-items:center;flex:1 1 auto;min-width:0}
.card-body{padding:9px 12px;background:var(--deep);font-family:ui-monospace,monospace;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow-y:auto}
.tag-in{flex:1 1 80px;min-width:60px;max-width:200px;padding:2px 6px;border-radius:3px;border:1px dashed var(--line);background:transparent;color:var(--teal);font-size:10.5px;font-family:inherit}
.badge{font-size:9.5px;background:var(--deep);padding:1px 5px;border-radius:2px;color:var(--mut)}
.empty{text-align:center;padding:46px 20px;color:var(--mut);font-size:13px;line-height:1.6}
.note{margin-top:14px;font-size:10.5px;color:var(--mut);text-align:center}
footer{border-top:1px solid var(--line);padding-top:11px;margin-top:24px;color:#41564D;font-size:10.5px;text-align:center}
.hide{display:none}
@media(max-width:820px){.wf-grid{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.fields{grid-template-columns:1fr}.wf-grid{grid-template-columns:1fr}}

.combo{position:relative}
.combo input{padding-right:28px}
.combo-arrow{position:absolute;right:0;top:0;bottom:0;width:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mut);font-size:9px;user-select:none}
.combo-list{position:absolute;top:100%;left:0;right:0;z-index:50;max-height:220px;overflow-y:auto;background:var(--deep);border:1px solid var(--teal);border-radius:4px;margin-top:2px;box-shadow:0 8px 20px rgba(0,0,0,.45)}
.combo-list.hide{display:none}
.combo-opt{padding:6px 9px;font-size:12px;color:var(--txt);cursor:pointer}
.combo-opt:hover,.combo-opt.hl{background:var(--panel2);color:var(--teal)}
.combo-empty{padding:6px 9px;font-size:11px;color:var(--mut);font-style:italic}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="eyebrow">Prompt Builder</div>
    <h1>CRAFT para ComfyUI</h1>
    <p class="sub">Arquitectura e interiorismo · SDXL y Flux · ES / EN / 中文 / JSON</p>
  </div>
  <div class="tabs">
    <button class="tab on" id="tabGen">Generar</button>
    <button class="tab" id="tabLib">Biblioteca</button>
  </div>
</header>

<section id="viewGen">
  <span class="lbl">Workflow</span>
  <div class="wf-grid" id="wfGrid"></div>
  <div class="hint hide" id="hint"></div>
  <div class="bar">
    <div class="grp"><span class="grp-l">Modelo</span><div id="modelBtns" style="display:flex;gap:4px"></div></div>
    <div class="grp"><span class="grp-l">Salida</span><div id="langBtns" style="display:flex;gap:4px"></div></div>
  </div>
  <div class="pills" id="pills"></div>
  <div class="fields" id="fields"></div>
  <div style="margin-bottom:12px">
    <label class="f-l">Detalle específico (opcional · se inserta tal cual, sin traducir)</label>
    <input type="text" id="extra" placeholder="un volumen en voladizo sobre el acceso, enmarcado por dos árboles maduros">
  </div>
  <div class="dn-box hide" id="dnBox">
    <div class="dn-head"><span class="dn-lbl">Denoise</span><span class="dn-val" id="dnVal">0.70</span></div>
    <input type="range" id="dnRange" min="0.10" max="1.00" step="0.01" value="0.70">
    <div class="dn-note" id="dnNote"></div>
  </div>
  <button class="go" id="btnGen">Generar</button>
  <div id="output"></div>
</section>

<section id="viewLib" class="hide">
  <div class="lib-bar">
    <input type="text" id="libSearch" placeholder="Buscar…">
    <select id="libWf"></select>
    <select id="libModel"><option value="all">Ambos modelos</option><option value="sdxl">SDXL</option><option value="flux">Flux</option></select>
    <select id="libSort"><option value="new">Recientes</option><option value="old">Antiguos</option><option value="wf">Por workflow</option></select>
    <button class="btn-xs" id="btnExport">Exportar JSON</button>
  </div>
  <div id="libList"></div>
  <div class="note">La biblioteca se guarda en este navegador. "Exportar JSON" descarga el archivo completo.</div>
</section>

<footer>MALI · Módulo 4 · Herramientas de Diseño Avanzadas</footer>
</div>

         `照片级建筑可视化, ${v.buildingType}, ${v.material}, ${v.context}, ${v.style}建筑, ${v.lighting}${ex}${q}`,N.base+", 草图风格, 线稿"],
    model3d:[`同一建筑，现以${v.material}进行照片级渲染。周边环境：${v.context}。${v.lighting}。色调为${v.palette}。使用${v.lens}拍摄。${ex} 真实材质与光照，专业建筑可视化。`,
         `照片级建筑渲染, ${v.material}, ${v.context}, ${v.lighting}, ${v.palette}, ${v.lens}${ex}${q}`,N.base+", 无材质, 白模渲染, 灰模"],
    site:[`同一视角，现展现${v.intervention}——一座${v.buildingType}，外立面采用${v.material}，${v.style}建筑语言。${v.lighting}，与原照片一致。${ex} 该介入与周边既有建成环境相融合。照片级真实。`,
         `${v.intervention}, ${v.buildingType}, ${v.material}, ${v.style}建筑, ${v.lighting}, 与既有城市环境融合, 与原照片相同光照${ex}${q}`,N.base],
    material:[`同一建筑，相同构图与光照，现外立面采用${v.material}。色调为${v.palette}。${ex} 真实的材质纹理与细节，专业建筑摄影。`,
         `同一建筑, 相同构图与光照, ${v.material}, ${v.palette}${ex}, 真实材质纹理, 建筑摄影, 高质量`,N.base+", 几何形体改变, 不同建筑"],
    massing:[`一项${v.scale}的${v.buildingType}体量研究，位于${v.context}。体量组织为${v.massing}。${ex} 白色抽象体量，无材质细节，概念实体模型美学，均匀阴天光照，干净中性背景。`,
         `建筑体量研究, ${v.scale}的${v.buildingType}, ${v.context}, ${v.massing}${ex}, 白色抽象体量, 概念模型, 无材质细节, 均匀光照, 干净背景`,N.mass]}
  };
  const a=S[lang][wfKey];
  return flux?{pos:a[0],neg:null}:{pos:a[1],neg:a[2]};
}

function buildJSON(wfKey,vals,model,extra,dn){
  const wf=WF[wfKey],spec={};
  wf.fields.forEach(f=>{spec[f]={es:resolve(f,vals[f],"es"),en:resolve(f,vals[f],"en"),zh:resolve(f,vals[f],"zh")};});
  const o={workflow:{id:wfKey,name:wf.es,type:wf.i2i?"image-to-image":"text-to-image"},
    model:{name:model,settings:SET[model]},craft:spec,custom_detail:extra||null,
    prompt:{es:buildPrompt(wfKey,vals,model,extra,"es").pos,en:buildPrompt(wfKey,vals,model,extra,"en").pos,zh:buildPrompt(wfKey,vals,model,extra,"zh").pos},
    negative_prompt:model==="flux"?null:{es:buildPrompt(wfKey,vals,model,extra,"es").neg,en:buildPrompt(wfKey,vals,model,extra,"en").neg,zh:buildPrompt(wfKey,vals,model,extra,"zh").neg},
    generated_at:new Date().toISOString()};
  if(wf.i2i)o.model.denoise=parseFloat(dn.toFixed(2));
  return o;
}

/* ===== ESTADO ===== */
let wfKey="ext", model="flux", lang="es", dn=0.70, out=null, lib=[];
const vals={}; Object.keys(T).forEach(k=>vals[k]=T[k][0][0]);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

try{const s=localStorage.getItem("craft_lib");if(s)lib=JSON.parse(s);}catch(e){}
const persist=()=>{try{localStorage.setItem("craft_lib",JSON.stringify(lib));}catch(e){}};

/* ===== COPIAR ===== */
function copyTxt(text,btn){
  const done=()=>{const o=btn.textContent;btn.textContent="✓";btn.classList.add("ok");setTimeout(()=>{btn.textContent=o;btn.classList.remove("ok");},1400);};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));}
  else fallback(text,done);
}
function fallback(text,cb){const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");cb();}catch(e){}document.body.removeChild(ta);}

/* ===== RENDER: WORKFLOWS ===== */
function renderWf(){
  $("wfGrid").innerHTML=Object.entries(WF).map(([k,w])=>
    `<button class="wf${k===wfKey?" on":""}" data-wf="${k}"><div class="wf-t">${esc(w.es)}</div><div class="wf-s">${esc(w.sub)}</div></button>`).join("");
  $("wfGrid").querySelectorAll("[data-wf]").forEach(b=>b.onclick=()=>{
    wfKey=b.dataset.wf; out=null;
    if(WF[wfKey].dn)dn=WF[wfKey].dn[2];
    renderAll();
  });
  const w=WF[wfKey];
  $("hint").className=w.hint?"hint":"hint hide";
  $("hint").textContent=w.hint||"";
}

/* ===== RENDER: MODELO / IDIOMA / PILLS ===== */
function renderBar(){
  $("modelBtns").innerHTML=["sdxl","flux"].map(m=>
    `<button class="opt${model===m?" on":""}${m==="flux"?" gold":""}" data-m="${m}">${m.toUpperCase()}</button>`).join("");
  $("modelBtns").querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{model=b.dataset.m;out=null;renderAll();});
  $("langBtns").innerHTML=LANGS.map(([k,l])=>
    `<button class="opt${lang===k?" on":""}" data-l="${k}">${esc(l)}</button>`).join("");
  $("langBtns").querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;out=null;renderAll();});
  $("pills").innerHTML=Object.entries(SET[model]).map(([k,v])=>`<span class="pill">${esc(k)} <b>${esc(v)}</b></span>`).join("");
  $("btnGen").textContent="Generar "+model.toUpperCase()+" · "+LANGS.find(l=>l[0]===lang)[1];
}

/* ===== RENDER: CAMPOS ===== */
function renderFields(){
  const w=WF[wfKey];
  $("fields").innerHTML=w.fields.map(f=>
    `<div><label class="f-l">${esc(w.labels[f])}</label>
      <div class="combo" data-combo="${f}">
        <input type="text" data-f="${f}" value="${esc(vals[f])}" autocomplete="off">
        <span class="combo-arrow" data-arrow="${f}">&#9662;</span>
        <div class="combo-list hide" data-list="${f}"></div>
      </div>
    </div>`).join("");
  w.fields.forEach(f=>initCombo(f));
}

function comboOptionsHTML(f,filterText){
  const items=T[f].filter(o=>!filterText||o[0].toLowerCase().includes(filterText.toLowerCase()));
  if(!items.length)return '<div class="combo-empty">Sin coincidencias — se usará el texto escrito</div>';
  return items.map(o=>`<div class="combo-opt" data-val="${esc(o[0])}">${esc(o[0])}</div>`).join("");
}

function initCombo(f){
  const wrap=document.querySelector(`[data-combo="${f}"]`);
  const input=wrap.querySelector("[data-f]");
  const list=wrap.querySelector("[data-list]");
  const arrow=wrap.querySelector("[data-arrow]");

  const open=(filterText)=>{
    list.innerHTML=comboOptionsHTML(f,filterText||"");
    list.classList.remove("hide");
    list.querySelectorAll(".combo-opt").forEach(o=>o.onclick=()=>{
      input.value=o.dataset.val; vals[f]=o.dataset.val; close();
    });
  };
  const close=()=>list.classList.add("hide");

  input.oninput=()=>{vals[f]=input.value; open(input.value);};
  input.onfocus=()=>open("");
  arrow.onclick=()=>{ list.classList.contains("hide") ? open("") : close(); input.focus(); };
  document.addEventListener("click",e=>{ if(!wrap.contains(e.target)) close(); });
}

/* ===== RENDER: DENOISE ===== */
function renderDn(){
  const w=WF[wfKey], box=$("dnBox");
  if(!w.i2i){box.className="dn-box hide";return;}
  const ok=dn>=w.dn[0]&&dn<=w.dn[1];
  box.className="dn-box"+(ok?"":" bad");
  $("dnVal").textContent=dn.toFixed(2);
  $("dnRange").value=dn;
  $("dnNote").textContent=ok
    ? "Rango recomendado: "+w.dn[0].toFixed(2)+" – "+w.dn[1].toFixed(2)
    : "Fuera del rango recomendado ("+w.dn[0].toFixed(2)+" – "+w.dn[1].toFixed(2)+")";
}
$("dnRange").oninput=e=>{dn=parseFloat(e.target.value);renderDn();};

/* ===== GENERAR ===== */
$("btnGen").onclick=()=>{
  const extra=$("extra").value.trim();
  out = lang==="json"
    ? {json:true,data:buildJSON(wfKey,vals,model,extra,dn)}
    : Object.assign({json:false,lang:lang},buildPrompt(wfKey,vals,model,extra,lang));
  renderOut();
};

function renderOut(){
  const c=$("output");
  if(!out){c.innerHTML="";return;}
  const w=WF[wfKey];
  const body=out.json?JSON.stringify(out.data,null,2):out.pos;
  const words=out.json?0:out.pos.trim().split(/\s+/).length;
  const lname=LANGS.find(l=>l[0]===(out.json?"json":out.lang))[1];
  c.innerHTML=`<div class="out">
    <div class="out-h">
      <div class="out-meta">
        <span style="color:${model==="flux"?"var(--gold)":"var(--teal)"};font-weight:700;font-size:12px">${model.toUpperCase()}</span>
        <span style="color:var(--mut);font-size:10.5px">${esc(lname)}</span>
        ${out.json?"":`<span style="color:var(--mut);font-size:10px">${words} palabras</span>`}
      </div>
      <div style="display:flex;gap:5px">
        <button class="btn-s mut" id="btnSave">Guardar</button>
        <button class="btn-s" id="btnCopyPos">Copiar</button>
      </div>
    </div>
    <div class="out-body${out.json?" json":""}">${esc(body)}</div>
    ${(!out.json&&out.neg)?`<div class="out-h" style="border-top:1px solid var(--line)">
        <span style="color:var(--neg);font-weight:700;font-size:11px">Negativo</span>
        <button class="btn-xs" id="btnCopyNeg">Copiar</button></div>
      <div class="out-neg">${esc(out.neg)}</div>`:""}
    ${(w.i2i&&!out.json)?`<div class="out-foot">Denoise <b>${dn.toFixed(2)}</b> · Load Image → VAE Encode → KSampler</div>`:""}
  </div>`;
  $("btnCopyPos").onclick=e=>copyTxt(body,e.target);
  if($("btnCopyNeg"))$("btnCopyNeg").onclick=e=>copyTxt(out.neg,e.target);
  $("btnSave").onclick=()=>{
    const w=WF[wfKey];
    lib.unshift({id:Date.now(),wfKey:wfKey,wf:w.es,model:model,lang:out.json?"json":out.lang,
      pos:body,neg:out.json?null:out.neg,dn:w.i2i?dn.toFixed(2):null,name:"",
      time:new Date().toLocaleString("es",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})});
    persist();renderLib();updateTabs();
    const b=$("btnSave");b.textContent="✓ Guardado";setTimeout(()=>b.textContent="Guardar",1400);
  };
}

/* ===== BIBLIOTECA ===== */
$("libWf").innerHTML='<option value="all">Todos los workflows</option>'+
  Object.entries(WF).map(([k,w])=>`<option value="${k}">${esc(w.es)}</option>`).join("");

function filtered(){
  const q=$("libSearch").value.toLowerCase(), fw=$("libWf").value, fm=$("libModel").value, so=$("libSort").value;
  let r=lib.filter(i=>(fw==="all"||i.wfKey===fw)&&(fm==="all"||i.model===fm)&&
    (!q||i.pos.toLowerCase().includes(q)||(i.name||"").toLowerCase().includes(q)));
  if(so==="old")r=r.slice().reverse();
  else if(so==="wf")r=r.slice().sort((a,b)=>a.wf.localeCompare(b.wf));
  return r;
}

function renderLib(){
  const list=filtered(), c=$("libList");
  if(!list.length){
    c.innerHTML=`<div class="empty">${lib.length===0
      ?'Sin prompts guardados.<br><span style="font-size:11.5px">Generar un prompt y usar "Guardar" para archivarlo.</span>'
      :"Ningún resultado con esos filtros."}</div>`;
    return;
  }
  c.innerHTML=list.map(it=>`<div class="card">
    <div class="card-h">
      <div class="card-meta">
        <span style="color:${it.model==="flux"?"var(--gold)":"var(--teal)"};font-weight:700;font-size:10.5px">${it.model.toUpperCase()}</span>
        <span style="color:var(--txt);font-size:10.5px">${esc(it.wf)}</span>
        <span class="badge">${it.lang.toUpperCase()}</span>
        ${it.dn?`<span style="color:var(--mut);font-size:9.5px">dn ${it.dn}</span>`:""}
        <input class="tag-in" data-tag="${it.id}" value="${esc(it.name||"")}" placeholder="+ etiqueta">
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <span style="color:var(--mut);font-size:9.5px">${esc(it.time)}</span>
        <button class="btn-xs" data-copy="${it.id}">Copiar</button>
        <button class="btn-xs" data-del="${it.id}" style="color:var(--mut)">×</button>
      </div>
    </div>
    <div class="card-body">${esc(it.pos)}</div>
  </div>`).join("");
  c.querySelectorAll("[data-copy]").forEach(b=>b.onclick=e=>{
    const it=lib.find(x=>x.id==b.dataset.copy);copyTxt(it.pos,e.target);});
  c.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    lib=lib.filter(x=>x.id!=b.dataset.del);persist();renderLib();updateTabs();});
  c.querySelectorAll("[data-tag]").forEach(i=>i.oninput=()=>{
    const it=lib.find(x=>x.id==i.dataset.tag);if(it){it.name=i.value;persist();}});
}

["libSearch","libWf","libModel","libSort"].forEach(id=>{
  $(id).addEventListener(id==="libSearch"?"input":"change",renderLib);});

$("btnExport").onclick=()=>{
  const data=JSON.stringify(lib.map(({id,...r})=>r),null,2);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="craft_prompts_"+new Date().toISOString().slice(0,10)+".json";
  a.click();URL.revokeObjectURL(a.href);
};

/* ===== TABS ===== */
function updateTabs(){$("tabLib").textContent="Biblioteca"+(lib.length?" ("+lib.length+")":"");}
$("tabGen").onclick=()=>{$("tabGen").classList.add("on");$("tabLib").classList.remove("on");$("viewGen").classList.remove("hide");$("viewLib").classList.add("hide");};
$("tabLib").onclick=()=>{$("tabLib").classList.add("on");$("tabGen").classList.remove("on");$("viewLib").classList.remove("hide");$("viewGen").classList.add("hide");renderLib();};

/* ===== INIT ===== */
function renderAll(){renderWf();renderBar();renderFields();renderDn();renderOut();}
renderAll();renderLib();updateTabs();

</script>
</body>
</html>
